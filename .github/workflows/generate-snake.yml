name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Kishor-N-K
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00FF00&color_dots=#39d353,#26a641,#006d32,#054c1c,#0a0a0a
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00FF00&color_dots=#39d353,#26a641,#006d32,#054c1c,#0a0a0a
